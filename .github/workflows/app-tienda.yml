name: App a la tienda

# A mano y solo a mano: construir un binario nuevo cuesta minutos de máquina y ocupa un
# número de versión que no se puede reutilizar. Un cambio de JavaScript no necesita pasar
# por acá — eso va por aire con `eas update`, ver mobile/README.md.
#
# Se dispara desde la app de GitHub en el teléfono: Actions → «App a la tienda» → Run.
on:
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Enviar a la pista interna de la Play Store al terminar'
        type: boolean
        default: true

permissions:
  contents: read

# Las acciones van fijadas por commit, como en ci.yml; `eas-cli`, por versión: con `latest`,
# una versión nueva de la herramienta podía cambiar el build sin que cambiara nada acá.

# Dos binarios a la vez pelearían por el mismo número de versión.
concurrency:
  group: app-tienda
  cancel-in-progress: false

jobs:
  construir:
    # Solo desde main: `workflow_dispatch` deja elegir la rama al apretar «Run», y un binario
    # de una rama sin revisar terminaría en la tienda con un número de versión gastado.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # La cola del plan gratis de EAS más el build: suele ser de diez a treinta minutos, a veces
    # bastante más esperando turno.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      # La reja de siempre antes de gastar una máquina de build: si la app no pasa sus
      # propias pruebas, no tiene sentido construir el binario.
      - run: npm test
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          # La misma versión con que se publican las actualizaciones por aire.
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      # `--wait`: el paso termina cuando el binario está listo, no cuando la cola lo acepta,
      # para que el envío de abajo tenga algo que enviar.
      - name: Construir el binario de producción
        run: eas build --platform android --profile production --non-interactive --wait
        working-directory: mobile

      # La credencial de la cuenta de servicio de Google vive en el almacén de EAS, no en
      # este repositorio: `eas submit` la toma de ahí. La pista la fija eas.json.
      - name: Enviar a la pista interna
        if: ${{ inputs.enviar }}
        run: eas submit --platform android --profile production --latest --non-interactive
        working-directory: mobile
