name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cada acción va fijada por su commit, no por su etiqueta: una etiqueta se puede mover a otro
# código, y un commit no. Dependabot propone las versiones nuevas una vez al mes
# (`.github/dependabot.yml`), con el commit y la versión en el comentario.

# Un empujón nuevo al mismo pull request cancela la corrida anterior: la respuesta que
# importa es la del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitio:
    runs-on: ubuntu-latest
    # Tarda unos dos minutos. Sin tope, un paso colgado ocupa la máquina seis horas.
    timeout-minutes: 20
    # Una Postgres de verdad, vacía, que nace y muere con el job: la usan las pruebas de
    # integración (`*.integracion.test.ts`), que migran una base desde cero —así también se
    # prueba que las migraciones corren antes de llegar a producción— y corren el SQL del
    # reclamo de publicación contra ella. La misma versión que la de Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run typecheck
      - run: npm run lint
      # Sin base: `generate` solo compara el esquema con el snapshot. Si aparece un archivo
      # nuevo es que alguien cambió el esquema y olvidó generar la migración.
      # stdin cerrado: si generate quisiera preguntar por un rename, falla en vez de colgarse.
      - run: npx drizzle-kit generate < /dev/null
      - run: |
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "El esquema cambió sin migración: corre npm run db:generate y commitea drizzle/"
            git status --porcelain -- drizzle
            exit 1
          fi
      # Sin credenciales a propósito: el build tiene que pasar sin base ni secretos, y ya
      # está verificado que pasa.
      - run: npx next build

  app:
    runs-on: ubuntu-latest
    # Tarda menos de un minuto.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
